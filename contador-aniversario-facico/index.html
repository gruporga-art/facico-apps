<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Aniversario FACICO</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: inherit;
        }
        #facico-countdown-widget {
            background: linear-gradient(135deg, #f0f4f8 0%, #ffffff 100%);
            border-left: 5px solid #18529D;
            border-right: 5px solid #28AD56;
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(24, 82, 157, 0.1);
            position: relative;
            overflow: hidden;
        }
        .facico-countdown-text {
            font-size: 1.2rem;
            color: #333;
            line-height: 1.6;
        }
        .facico-time {
            font-weight: 800;
            color: #18529D;
            font-size: 1.4rem;
            background: #e8f0fe;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .facico-number {
            font-weight: 800;
            color: #28AD56;
            font-size: 1.4rem;
        }
        .facico-celebration {
            font-size: 1.8rem;
            font-weight: 800;
            color: #18529D;
            animation: facico-pulse 2s infinite ease-in-out;
        }
        .facico-celebration span {
            color: #28AD56;
        }
        @keyframes facico-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        #facico-fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="facico-countdown-widget">
        <canvas id="facico-fireworks-canvas"></canvas>
        <div id="facico-countdown-content">Cargando...</div>
    </div>

    <script>
    (function() {
        const inaugurationYear = 1954;
        const targetMonth = 1;
        const targetDay = 22;
        let fireworksInterval = null;

        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let nextAnniversary = new Date(currentYear, targetMonth, targetDay, 0, 0, 0, 0);
            
            if (now > nextAnniversary) {
                nextAnniversary = new Date(currentYear + 1, targetMonth, targetDay, 0, 0, 0, 0);
            }

            const anniversaryNumber = nextAnniversary.getFullYear() - inaugurationYear;
            const isAnniversaryDay = (now.getMonth() === targetMonth && now.getDate() === targetDay);
            const contentDiv = document.getElementById('facico-countdown-content');

            if (!contentDiv) return;

            if (isAnniversaryDay) {
                contentDiv.innerHTML = `<div class="facico-celebration">¡Feliz aniversario <span>${anniversaryNumber}</span> comunidad Facico!</div>`;
                if (!fireworksInterval) {
                    startFireworks();
                }
                return;
            }

            const diff = nextAnniversary - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            contentDiv.innerHTML = `
                <div class="facico-countdown-text">
                    Faltan <span class="facico-time">${days} días, ${hours} horas, ${minutes} minutos y ${seconds} segundos</span><br>
                    para el aniversario <span class="facico-number">${anniversaryNumber}</span>
                </div>
            `;
        }

        function startFireworks() {
            const canvas = document.getElementById('facico-fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const particles = [];
            const colors = ['#18529D', '#28AD56', '#FFD700', '#FF6B6B', '#FFFFFF'];

            function createParticle(x, y) {
                const particleCount = 30;
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: x, y: y,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        radius: Math.random() * 3 + 1,
                        velocity: { x: (Math.random() - 0.5) * 6, y: (Math.random() - 0.5) * 6 },
                        life: 100, alpha: 1
                    });
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (Math.random() < 0.05) {
                    createParticle(Math.random() * canvas.width, Math.random() * canvas.height * 0.6);
                }
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.velocity.y += 0.05;
                    p.x += p.velocity.x;
                    p.y += p.velocity.y;
                    p.life--;
                    p.alpha = p.life / 100;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    if (p.life <= 0) { particles.splice(i, 1); i--; }
                }
                fireworksInterval = requestAnimationFrame(animate);
            }
            animate();
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    })();
    </script>
</body>
</html>
